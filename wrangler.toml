name = "family-tools"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Solo se accede por sbkperez.me (protegido con Access): sin direcciones alternativas
workers_dev = false
preview_urls = false

# La web (PWA) se sirve desde /public
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/cal/*"]

# Dominio: crea la ruta en Cloudflare o descomenta esto tras el primer deploy
# routes = [{ pattern = "sbkperez.me", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "family-hub"
database_id = "b93ce0aa-83a4-4612-8648-023e24a891c3"

[vars]
# Emails que pueden usar la plataforma y enviar tareas por email (separados por coma)
ALLOWED_SENDERS = "gportabella@gmail.com,sabrina.schaerf@gmail.com"
USER_NAMES = "Gonzalo,Sabrina"
USER_FULLNAMES = "Gonzalo Portabella,Sabrina Schaerf"
CLAUDE_MODEL = "claude-sonnet-5-5"
# Equipo de Cloudflare Access, p.ej. "sbkperez" para sbkperez.cloudflareaccess.com
ACCESS_TEAM = "sbkperez"
# AUD tag de la aplicación de Access (Zero Trust → Access → Applications)
ACCESS_AUD = "7da86e38c5ebeadfd4b00fe8480324814d4cd7a06c055d319576ca987c9ae16c"

# Desde aquí salen las invitaciones de calendario (dominio con Email Routing activo)
MAIL_FROM = "calendario@sbkperez.me"

# Secretos (no van aquí): wrangler secret put ANTHROPIC_API_KEY

# Tarea programada semanal (de momento solo aplica migraciones pendientes)
[triggers]
crons = ["0 7 * * SUN"]

# Registros visibles en Cloudflare → family-tools → Logs
[observability]
enabled = true

# Envío de emails (invitaciones). En el plan gratuito solo a direcciones verificadas en Email Routing.
[[send_email]]
name = "EMAIL"
